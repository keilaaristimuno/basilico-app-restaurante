<ion-header class="header-transparente">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        defaultHref="/inicio"
        text="Volver"
        icon="chevron-back-outline">
      </ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="login-content">
  <div class="login-container">
    
    <!-- Header / Logo -->
    <div class="header-section">
      <img class="logo" src="assets/Basilico/Basiloco_beige.png" alt="Logotipo" routerLink="/accesoRapido" />
      <h1 class="titulo-login">Iniciar Sesión</h1>
    </div>

    <!-- Formulario -->
    <div class="form-section inicio">
      <ion-list lines="none" class="login-list">
        
        <ion-item class="custom-item">
          <ion-input 
            label="Correo"
            type="email" 
            labelPlacement="floating" 
            fill="solid" 
            [(ngModel)]="mail" 
            placeholder="Ingrese su correo">
          </ion-input>
        </ion-item>

        <ion-item class="custom-item">
          <ion-input 
            label="Contraseña"
            type="password"
            labelPlacement="floating" 
            fill="solid" 
            [(ngModel)]="clave" 
            placeholder="Ingrese su Contraseña">
          </ion-input>
        </ion-item>

      </ion-list>

      <!-- Botones -->
      <div class="">
        <ion-button class="btonVerdeBorde" (click)="ingresar()" [disabled]="cargando()">
          @if (cargando()) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Ingresar
          }
        </ion-button>
        
        <ion-button expand="block" fill="outline" class="btonTerracota" routerLink="/registro">
          Registrarse
        </ion-button>
      </div>

      <!-- Errores -->
      @if (ingresoIncorrecto()) {
        <ion-text color="danger" class="error-text">
          <p>{{ mensajeError() || 'Credenciales incorrectas' }}</p>
        </ion-text>
      }
    </div>

  </div>
</ion-content>
