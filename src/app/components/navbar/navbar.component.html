<ion-tab-bar class="custom-tab-bar">
  
  @if (modoVolver) {
    <ion-tab-button [routerLink]="rutaInicio" class="tab-btn-volver">
      <div class="contenido-volver-nav">
        <ion-icon name="chevron-back-outline"></ion-icon>
        <span>Volver</span>
      </div>
    </ion-tab-button>
  } @else {
    <ion-tab-button [routerLink]="rutaInicio" class="tab-btn-logo">
      <img class="logoChico" src="assets/Basilico/Logo_beige.png" alt="Logotipo">
    </ion-tab-button>
  }

  <div class="navbar-centro">
    @if(titulo){
      <div class="textoTitulo">{{titulo}}</div>
    } @else if(nombre !== null){
      <div class="textoNombre">{{nombre}}</div>
    }
  </div>

  @if (!modoVolver) {
    <ion-tab-button (click)="cerrarSesion()" class="tab-btn-salir">
      <ion-label class="label-cerrar-sesion">
        <span>Cerrar</span>
        <span>sesión</span>
      </ion-label>
    </ion-tab-button>
  } @else {
    <div class="espaciador-volver-derecha"></div>
  }

</ion-tab-bar>
