<ion-content class="login-content" [fullscreen]="true" [scrollY]="!mostrarAnimacion()" [class.splash-activa]="mostrarAnimacion()">
  <!-- Capa de Presentación / Splash (Solo se muestra en el arranque inicial) -->
  @if (mostrarAnimacion()) {
    <div class="presentacion-container" [class.desvanecer]="desvanecerAnimacion()">
      <!-- Hojas cayendo sutilmente con balanceo natural -->
      <div class="hojas-flotantes-layer" [class.animar]="animacionActiva()">
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-1" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-2" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-3" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-4" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-5" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-6" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-7" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-8" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-9" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-10" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-11" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-12" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-13" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-14" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-15" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-16" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-17" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-18" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-19" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-20" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-21" />
        <img src="assets/Basilico/hojas_beige.png" alt="" class="hoja-cae h-22" />
      </div>

      <!-- Logo en el centro exacto de la pantalla (Limpio y elegante) -->
      <div class="logo-box">
        <img
          src="assets/Basilico/Logo_beige.png"
          alt="Basílico"
          class="logo-presentacion"
          [class.animar]="animacionActiva()"
        />
      </div>

      <!-- Créditos entrando fluidamente desde la izquierda -->
      <div class="creditos-box" [class.entrar]="animacionActiva()">
        <p class="grupo-titulo">Grupo Basílico</p>
        <div class="integrantes">
          <span class="integrante">Agustina Seggiaro</span>
          <span class="integrante">Francisco Cuenca</span>
          <span class="integrante">Keila Aristimuño</span>
          <span class="integrante">Ignacio Arriaga</span>
        </div>
      </div>
    </div>
  }

  <!-- Contenedor real de Inicio (Aparece tras terminar la presentación) -->
  <div class="login-container" [class.visible]="!mostrarAnimacion()" [class.oculto]="mostrarAnimacion()">
    <!-- Header / Logo de Sabores de Italia -->
    <div class="header-section">
      <img class="logo" src="assets/Basilico/Basiloco_beige.png" alt="Logotipo" />
      <h1 class="titulo-login">SABORES DE ITALIA</h1>
    </div>

    <div class="botones-inicio">
      <ion-button expand="block" fill="outline" class="btonBeige" routerLink="/login">
        Iniciar Sesión
      </ion-button>
      <ion-button expand="block" fill="outline" class="btonTerracota" routerLink="/registro">
        Registrarse
      </ion-button>
      <ion-button expand="block" fill="outline" class="btonVerdeBorde" routerLink="/registroAnonimo">
        Anónimo
      </ion-button>
    </div>
  </div>
</ion-content>
