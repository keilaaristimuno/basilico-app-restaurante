<ion-content [fullscreen]="true" class="fondo" [scrollY]="false">
  <div class="pantalla-completa">
    <app-navbar rutaInicio="/duenioInicio"></app-navbar>

    <div class="contenedor-duenio">
      <section class="encabezado">
        <img
          src="assets/Basilico/Logo_beige.png"
          alt="Logotipo de Basílico"
          class="logo">

        <h1>Dueño</h1>
        <p>
          Seleccione la opción que desea realizar
        </p>
      </section>

      <section class="acciones">
        <div class="tarjeta" routerLink="/alta-empleado">
          <ion-card-content>
            <ion-icon
                name="people-outline"
                class="icono">
              </ion-icon>
            <div class="informacion">  
              <h2>Alta empleados</h2>
              <p>Seleccione para dar de alta un nuevo empleado</p>
            </div>
          </ion-card-content>
        </div>
        <div class="tarjeta" routerLink="/alta-mesa">
          <ion-card-content>
            <ion-icon
                name="restaurant-outline"
                class="icono">
              </ion-icon>
            <div class="informacion">
              <h2>Alta mesa</h2>
              <p>Seleccione para dar de alta una nueva mesa</p>
            </div>
          </ion-card-content>
        </div>
        <div class="tarjeta" routerLink="/clientes-pendientes">
          <ion-card-content>
            <ion-icon
                name="time-outline"
                class="icono">
              </ion-icon>
            <div class="informacion">
              <h2>Clientes pendientes</h2>
              <p>Visualizar los clientes pendientes a autorizar.</p>
            </div>
          </ion-card-content>
        </div>
      </section>
    </div>
  </div>
</ion-content>
