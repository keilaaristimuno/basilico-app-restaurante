<ion-content class="contenido">
  <div class="contenedor">
    <div class="contenido">
    
    <img class="logo" src="assets/Basilico/Basiloco_beige.png" alt="Logotipo" />
    <h2 class="titulo">Escaneá para ingresar a lista de espera</h2>
    <div class="qr">
        @if (qrImage()) {
      <div>
        <img [src]="qrImage()" alt="QR de Ingreso" />
      </div>
      } @else {
        <p>Cargando código QR...</p>
      }
      </div>
    </div>
    
  </div>
  
</ion-content>
