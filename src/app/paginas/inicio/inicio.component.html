<ion-content class="login-content" [fullscreen]="true">
  <!-- Capa de Presentación / Splash (Solo se muestra en el arranque inicial) -->
  @if (mostrarAnimacion()) {
    <div class="presentacion-container" [class.desvanecer]="desvanecerAnimacion()">
      <!-- Logo aislado en el centro exacto de la pantalla -->
      <div class="logo-box">
        <img
          src="assets/Basilico/Logo_beige.png"
          alt="Basílico"
          class="logo-presentacion"
          [class.animar]="animacionActiva()"
        />
      </div>

      <!-- Créditos entrando fluidamente desde la izquierda -->
      <div class="creditos-box" [class.entrar]="animacionActiva()">
        <p class="grupo-titulo">Grupo Basílico</p>
        <div class="integrantes">
          <span class="integrante">Agustina Seggiaro</span>
          <span class="integrante">Francisco Cuenca</span>
          <span class="integrante">Keila Aristimuño</span>
          <span class="integrante">Ignacio Arriaga</span>
        </div>
      </div>
    </div>
  }

  <!-- Contenedor real de Inicio (Aparece tras terminar la presentación) -->
  <div class="login-container" [class.visible]="!mostrarAnimacion()" [class.oculto]="mostrarAnimacion()">
    <!-- Header / Logo de Sabores de Italia -->
    <div class="header-section">
      <img class="logo" src="assets/Basilico/Basiloco_beige.png" alt="Logotipo" />
      <h1 class="titulo-login">SABORES DE ITALIA</h1>
    </div>

    <div class="botones-inicio">
      <ion-button expand="block" fill="outline" class="btonBeige" routerLink="/login">
        Iniciar Sesión
      </ion-button>
      <ion-button expand="block" fill="outline" class="btonTerracota" routerLink="/registro">
        Registrarse
      </ion-button>
      <ion-button expand="block" fill="outline" class="btonVerdeBorde" routerLink="/registroAnonimo">
        Anónimo
      </ion-button>
    </div>
  </div>
</ion-content>
