<ion-header class="header-transparente">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        defaultHref="/login"
        text="Volver"
        icon="chevron-back-outline">
      </ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

      <img class="logoAcceso" src="assets/Basilico/Basiloco_beige.png" alt="Logotipo" routerLink="/login"/>

    <div>
        <ion-button expand="block" fill="outline" class="btonBeige" (click)="ingresar('cliente@example.com','123456')">
          Cliente

          Dueño
        </ion-button>
        <ion-button expand="block" fill="outline" class="btonBeige" (click)="ingresar('supervisor@example.com','holo123')">
          Supervisor
        </ion-button>
        <ion-button expand="block" fill="outline" class="btonBeige" (click)="ingresar('metre@example.com','123456')">
          Metre
        </ion-button>
        <ion-button expand="block" fill="outline" class="btonBeige" (click)="ingresar('mozo@example.com','123456')">
          Mozo
        </ion-button>
        <ion-button expand="block" fill="outline" class="btonBeige" (click)="ingresar('cocinero@example.com','rober123')">
