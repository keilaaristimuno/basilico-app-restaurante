<ion-content [fullscreen]="true" class="fondo" [scrollY]="false">
  <div class="pantalla-completa">
    <app-navbar rutaInicio="/metreInicio"></app-navbar>

    <div class="contenedor-metre">
      <section class="encabezado">
        <img
          src="assets/Basilico/Logo_beige.png"
          alt="Logotipo de Basílico"
          class="logo">

        <h1>Metre</h1>
        <p>Seleccione la opción que desea realizar</p>
      </section>

      <section class="acciones">
        <ion-card class="tarjeta-metre" routerLink="/registro" button="true">
          <ion-card-content>
            <ion-icon name="person-add-outline" class="icono"></ion-icon>
            <div class="informacion">  
              <h2>Registro de Cliente</h2>
              <p>Registrar un nuevo cliente en el sistema.</p>
            </div>
          </ion-card-content>
        </ion-card>

        <ion-card class="tarjeta-metre" routerLink="/listaEspera" button="true">
          <ion-card-content>
            <ion-icon name="list-outline" class="icono"></ion-icon>
            <div class="informacion">
              <h2>Lista de Espera</h2>
              <p>Clientes aguardando asignación de mesa.</p>
            </div>
          </ion-card-content>
        </ion-card>
      </section>
    </div>
  </div>
</ion-content>
